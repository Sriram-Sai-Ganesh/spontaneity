# .github/workflows/sync-from-org.yml
name: Sync from team-05

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          repository: Sriram-Sai-Ganesh/spontaneity
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ORG_REPO_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add org repo as upstream
        run: |
          git remote add upstream https://x-access-token:${{ secrets.ORG_REPO_SYNC_TOKEN }}@github.com/cs423sp26-homeworks/team-05.git
          git fetch upstream master

      - name: Merge team-05 master into spontaneity main
        run: |
          git checkout main
          git merge upstream/master --no-edit --allow-unrelated-histories

      - name: Push to spontaneity main
        run: |
          git push origin main
