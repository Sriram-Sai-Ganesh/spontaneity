# .github/workflows/sync-from-org.yml
name: Sync from org repo

on:
  schedule:
    - cron: "0 */1 * * *" # every 1 hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORG_REPO_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add org repo as upstream
        run: |
          git remote add upstream https://x-access-token:${{ secrets.ORG_REPO_SYNC_TOKEN }}@github.com/cs423sp26-homeworks/team-05.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout master
          git merge upstream/master --no-edit

      - name: Push changes to personal repo
        run: |
          git push origin main
