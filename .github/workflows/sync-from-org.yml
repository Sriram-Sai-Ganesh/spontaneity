name: Sync from team-05

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-from-org
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone upstream master
        env:
          SYNC_TOKEN: ${{ secrets.ORG_REPO_SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::Set the ORG_REPO_SYNC_TOKEN repository secret with read access to cs423sp26-homeworks/team-05."
            exit 1
          fi

          git clone \
            --depth 1 \
            --branch master \
            "https://x-access-token:${SYNC_TOKEN}@github.com/cs423sp26-homeworks/team-05.git" \
            "${RUNNER_TEMP}/team-05"

      - name: Mirror upstream files
        run: |
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            "${RUNNER_TEMP}/team-05/" \
            ./

      - name: Commit and push changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi

          git commit -m "Sync from cs423sp26-homeworks/team-05"
          git push origin main
